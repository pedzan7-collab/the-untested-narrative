<style>
/* Layout: a case-file archive. Dark brand masthead, then a reading column (posts) or an index of numbered files with a side rail. */

<h2>The Supreme Court has identified a real concern</h2>
<p>In November 2025, the UK Supreme Court ruled that the Scottish courts’ approach to certain evidential restrictions in sexual-offence trials needed modification because it was liable to infringe defendants’ fair-trial rights [[1]].</p>
<p>In <em>Daly and Keir v His Majesty’s Advocate</em>, the Court criticised an approach under which evidence concerning a complainant’s credibility or sexual behaviour was almost always excluded. Excessive restrictions, the Court explained, can prevent defendants from presenting a full defence and challenging the prosecution’s evidence [[1]].</p>
<p>The point of this is not that all sexual-history evidence should automatically be admitted. It is that courts must examine what particular evidence actually contributes to a fair trial [[1]].</p>
<h2>Scottish advocate Thomas Ross KC has also raised concerns</h2>
<p>According to Scottish Legal, he stopped accepting sexual-offence cases over trial-fairness concerns and criticised restrictions on challenging allegedly false accounts of material facts. He argued that these over-stretched shield laws have prevented defence lawyers from putting critical, context-establishing evidence before juries [[2]].</p>
<h2>Sexual history and evidence of a false statement are different things</h2>
<p>Someone’s sexual history does not make them dishonest [[3]].</p>
<p>But evidence that a particular, materially relevant statement is false raises a different question [[4]].</p>
<div class="example"><span class="label gold">For example</span>Consider an accusation where the complainant makes a specific factual claim, such as having no previous sexual experience, to bolster their narrative, but objective, verifiable medical records or digital evidence directly disprove this claim. In such a scenario, the evidence is not sought to make an assumption about character, but to challenge a demonstrably false statement of material fact that has been placed before the jury.</div>
<p>CPS guidance for England and Wales recognises that questioning focused purely on the falsity of an earlier allegation does not automatically engage sexual-history restrictions. There must, however, be a proper evidential basis for saying it was false. A withdrawn complaint or an acquittal is not automatically proof of fabrication [[4]].</p>
<h2>Fairness must protect both sides</h2>
<p>In the House of Lords case <em>R v A (No 2)</em>, Lord Steyn explained that evidence should not be excluded where its relevance to consent is so significant that exclusion would endanger the trial’s fairness. He also recognised that a previous sexual relationship cannot prove consent on the occasion being investigated [[3]].</p>

<p>The argument is not that complainants should have their private lives put on trial. It is that protective rules must not prevent defendants from presenting evidence necessary for a fair defence [[3]].</p>

      <div class="crumbs"><span class="label gold">File ${pad(p.file)}</span>${p.topics.map(t => `<a class="label" href="#topic-${t}">${TOPICS[t].name}</a>`).join("")}<span class="label">${FORMATS[p.format]}</span></div>
      <h1>${esc(p.title)}</h1>
      <p class="dek">${esc(p.dek)}</p>
      <div class="byline"><img src="media/logo.png" alt=""><div><div class="who">The Untested Narrative</div><div class="label">${fmtDate(p.date)} · ${readTime(p)}</div></div></div>
    </header>
    ${hero}
    ${quiz}
    ${p.body.trim() ? `<div class="body">${citeHTML(p.body)}</div>` : ""}
    <div class="ask"><span class="label gold">Join the discussion</span><p>${esc(p.ask)}</p></div>
    ${sources}
    <div class="tags">${p.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>
    <section class="comments" id="comments" aria-label="Comments"></section>
    <nav class="pager" aria-label="More files">
      ${older ? `<a href="#post-${older.slug}"><span class="label">← Previous file · ${pad(older.file)}</span><span class="t">${esc(older.title)}</span></a>` : "<span></span>"}
      ${newer ? `<a href="#post-${newer.slug}"><span class="label">Next file · ${pad(newer.file)} →</span><span class="t">${esc(newer.title)}</span></a>` : "<span></span>"}
    </nav>
  </article>`;
  view.querySelectorAll(".cite button").forEach(b => b.addEventListener("click", () => {
    const li = document.getElementById("src-" + b.dataset.ref); if (!li) return;
    li.scrollIntoView({ behavior: "smooth", block: "center" });
    li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1600);
  }));
  if (p.quiz) {
    const qz = document.getElementById("quiz");
    qz.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      const pick = b.dataset.k, right = p.quiz.answer;
      qz.querySelectorAll(".opt").forEach(o => {
        o.disabled = true;
        const opt = p.quiz.options.find(x => x[0] === o.dataset.k);
        if (o.dataset.k === right) o.classList.add("right");
        else if (o.dataset.k === pick) o.classList.add("wrong");
        if (opt[2]) o.insertAdjacentHTML("beforeend", `<span class="why">${esc(opt[2])}</span>`);
      });
      document.getElementById("verdict").innerHTML = `<div class="verdict"><span class="label gold">${pick === right ? "Correct" : "Not quite"} · The answer is ${right}</span><h3>${pick === right ? "You spotted it." : "The answer is D."}</h3><p>${esc(p.quiz.explain)}</p></div>`;
    }));
  }
  renderComments();
}

function renderSources() {
  renderNav("sources");
  const map = new Map();
  ordered().forEach(p => p.sources.forEach(s => { if (!map.has(s.url)) map.set(s.url, { ...s, posts: [] }); map.get(s.url).posts.push(p); }));
  const groups = ["Courts & case law", "Official guidance", "Research & commentary", "News & reporting"];
  view.innerHTML = `
  <div class="lib">
    <header class="page-head"><span class="label gold">Reference</span><h1>Sources library</h1><p>Every judgment, guideline and study cited on this site, grouped by type, with links back to the files that rely on them.</p></header>
    ${groups.map(g => { const items = [...map.values()].filter(s => s.kind === g); return items.length ? `<h2>${g}</h2><ul>${items.map(s => `<li><a class="src" href="${s.url}" target="_blank" rel="noopener">${esc(s.title)} ↗</a><span>${esc(s.name)}</span><span class="cited">Cited in ${s.posts.map(p => `<a href="#post-${p.slug}">File ${pad(p.file)}: ${esc(p.title)}</a>`).join("; ")}</span></li>`).join("")}</ul>` : ""; }).join("")}
  </div>`;
}

function renderAbout() {
  renderNav("about");
  view.innerHTML = `
  <div class="about">
    <header class="page-head"><span class="label gold">About</span><h1>The Untested Narrative</h1><p>Evidence. Due process. Accountability.</p></header>
    <p>Taking sexual violence seriously. Protecting the innocent. The Untested Narrative publishes frequent, evidence-led posts on wrongful convictions, disputed allegations and failures of justice.</p>
    <p class="principle">Taking allegations seriously and protecting the innocent are not opposing goals; both require the exact same commitment to finding the truth.</p>
    <p>Each post is filed under a number and a topic, and every factual claim points to its source: court judgments, official prosecution guidance, parliamentary evidence and peer-reviewed research. You can browse them all in the <a href="#sources">sources library</a>.</p>
    <p>What you'll find here:</p>
    <ul>
      <li><strong>Long reads</strong> that work through a legal or psychological question in depth.</li>
      <li><strong>Videos</strong>: short explainers and one-minute breakdowns.</li>
      <li><strong>Quizzes</strong> that test how well you can spot the failures that lead to miscarriages of justice.</li>
    </ul>
    <p>Comments are open on every post. Disagreement is welcome; keep it civil and stick to the evidence.</p>
    <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:1.5rem"><a class="btn" href="${FB_PAGE}" target="_blank" rel="noopener">Follow on Facebook ↗</a><a class="btn ghost" href="https://www.youtube.com/watch?v=Gt9Tb6KX838" target="_blank" rel="noopener">Watch on YouTube ↗</a></div>
  </div>`;
}

/* ---------- comments UI ---------- */
function currentSlug() { const h = location.hash.slice(1); return h.startsWith("post-") ? h.slice(5) : null; }
function initials(n) { return (n || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function timeAgo(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
let draft = "";
function renderComments() {
  const box = document.getElementById("comments"); const slug = currentSlug(); if (!box || !slug) return;
  const mine = allComments.filter(c => c.post === slug).sort((a, b) => a.ts - b.ts);
  const total = mine.length + (AUTHOR_REPLIES[slug] ? 1 : 0);
  let composer = "";
  if (cState === "off") composer = (window.claude && window.claude.use)
    ? `<p class="note">Sign in to claude.ai to read and join the reader discussion. You can also comment on the original post on <a href="${FB_PAGE}" target="_blank" rel="noopener">Facebook</a>.</p>`
    : `<p class="note">Join the conversation on our <a href="${FB_PAGE}" target="_blank" rel="noopener">Facebook page</a>.</p>`;
  else if (cState === "error") composer = `<p class="note err">Comments can't be loaded right now. Refresh the page to try again.</p>`;
  else composer = `<form class="composer" id="cform"><label class="label" for="ctext">Add a comment</label><textarea id="ctext" maxlength="2000" placeholder="Share your view. Please keep it civil and evidence-based."></textarea><div class="bar"><span class="note" id="cnote">${cState === "loading" ? "Loading comments…" : cState === "slow" ? "Comments are taking a while to load. They may be out of date." : "Comments are visible to everyone who can open this page."}</span><button class="btn" type="submit" id="csend">Post comment</button></div></form>`;
  const authorItem = AUTHOR_REPLIES[slug] ? `<li class="cmt"><span class="avatar"><img src="media/logo.png" alt=""></span><div><div class="head"><span class="name">The Untested Narrative</span><span class="author-tag">Author</span><span class="label">Pinned</span></div><div class="text">${AUTHOR_REPLIES[slug]}</div></div></li>` : "";
  const items = mine.map(c => {
    const n = names[c.author] || "Reader";
    const canDel = me && (c.author === me || isOwner);
    return `<li class="cmt"><span class="avatar">${esc(initials(n))}</span><div><div class="head"><span class="name">${esc(n)}</span><span class="label">${esc(timeAgo(c.ts))}</span></div><p class="text">${esc(c.text)}</p>${canDel ? `<div class="act"><button class="linkbtn" data-del="${esc(c.id)}">Delete</button></div>` : ""}</div></li>`;
  }).join("");
  box.innerHTML = `<span class="label gold">Discussion</span><h2>${total} comment${total === 1 ? "" : "s"}</h2>${composer}<ul class="thread">${authorItem}${items}</ul>${!total && cState !== "off" && cState !== "error" ? `<p class="empty">No comments yet. Start the discussion.</p>` : ""}`;
  const ta = document.getElementById("ctext");
  if (ta) { ta.value = draft; ta.addEventListener("input", () => draft = ta.value); }
  const form = document.getElementById("cform");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = ta.value.trim(); const note = document.getElementById("cnote"); const send = document.getElementById("csend");
    if (!text) { note.textContent = "Write something before posting."; note.className = "note err"; return; }
    if (!db || !me) { note.textContent = "Comments aren't available to you yet. Sign in to claude.ai and reopen this page."; note.className = "note err"; return; }
    send.disabled = true; note.textContent = "Posting…"; note.className = "note";
    try {
      await db.collection("comments").add({ post: slug, text: text.slice(0, 2000), author: me, ts: Date.now() });
      draft = ""; ta.value = "";
    } catch (err) {
      note.className = "note err";
      note.textContent = err && (err.code === "permission_denied" || err.code === "invalid_argument" || err.code === "not_granted")
        ? "Your access lets you read comments but not post them. Ask the site owner for Contributor access."
        : "Your comment didn't post. Check your connection and try again.";
      send.disabled = false;
    }
  });
  box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirm delete"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Delete"; } }, 4000); return; }
    b.disabled = true;
    try { await db.doc("comments/" + b.dataset.del).delete(); } catch (e) { b.textContent = "Couldn't delete"; }
  }));
}
function refreshCounts() {
  const c = counts();
  document.querySelectorAll("[data-count]").forEach(el => { const n = c[el.dataset.count] || 0; el.textContent = n + " comment" + (n === 1 ? "" : "s"); });
}
async function resolveNames() {
  if (!usr) return;
  const ids = [...new Set(allComments.map(c => c.author).filter(Boolean))];
  if (!ids.length) return;
  try { const ps = await usr.profiles(ids); ids.forEach(id => { names[id] = (ps && ps[id] && ps[id].name) || "Reader"; }); } catch (e) {}
}

async function startComments() {
  if (!window.claude || !window.claude.use) { cState = "off"; renderComments(); return; }
  try { [db, usr] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  if (!db) { cState = "off"; renderComments(); return; }
  if (usr) { try { me = await usr.id(); isOwner = !!(await usr.isOwner()); } catch (e) {} }
  const timer = setTimeout(() => { if (cState === "loading") { cState = "slow"; renderComments(); } }, 10000);
  db.collection("comments").orderBy("ts", "asc").limit(1000).onSnapshot(async snap => {
    allComments = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => typeof c.text === "string" && typeof c.post === "string");
    if (!snap.metadata.fromCache) { clearTimeout(timer); cState = "ready"; } else if (cState === "loading") cState = "ready";
    await resolveNames();
    const ta = document.getElementById("ctext");
    if (!(ta && document.activeElement === ta)) renderComments(); else updateThreadOnly();
    refreshCounts();
  }, () => { clearTimeout(timer); cState = "error"; renderComments(); });
}
function updateThreadOnly() {
  // Keep the textarea focused while new comments arrive: re-render, then restore focus and caret.
  const ta = document.getElementById("ctext"); const pos = ta ? ta.selectionStart : 0;
  renderComments();
  const nta = document.getElementById("ctext"); if (nta) { nta.focus(); try { nta.setSelectionRange(pos, pos); } catch (e) {} }
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("post-")) renderPost(h.slice(5));
  else if (h.startsWith("topic-")) renderTopic(h.slice(6));
  else if (h === "sources") renderSources();
  else if (h === "about") renderAbout();
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
startComments();
</script>
